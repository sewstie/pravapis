[project]
name = "pravapis"
version = "0.1.0"
description = "Bidirectional Belarusian orthography converter (Narkamaŭka ↔ Taraškievica)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vladislav Hushcha" }]
keywords = ["belarusian", "orthography", "nlp", "taraskievica", "narkamauka"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "regex>=2024.5.15",
  "marisa-trie>=1.2.0",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "joblib>=1.4", "pandas>=2.2"]

[project.scripts]
pravapis = "pravapis.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
  "httpx>=0.27",
  "types-PyYAML",
  "pre-commit>=3.7",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "types-regex>=2026.9.10.20260911",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pravapis"]

[tool.hatch.build.targets.sdist]
include = ["src/pravapis", "data", "README.md", "pyproject.toml"]

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W"]
# RUF001-003 flag "ambiguous" Unicode; this project is *about* Cyrillic.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["marisa_trie", "sklearn.*", "joblib", "pandas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --benchmark-disable"

[tool.coverage.run]
source = ["pravapis"]
branch = true
