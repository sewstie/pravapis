name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: uv python install 3.12
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Every data/rules/ pattern must compile as JS RegExp (stdlib re as a portability
      # proxy, then an actual Node `new RegExp(p, 'u')`) and avoid constructs — \w \b \Z,
      # inline flags, conditional groups — that compile fine but silently never fire on
      # Cyrillic in a JS port. Runs before anything that would build on top of the rules.
      - run: uv run python scripts/lint_patterns.py
      # data/chars/*.tsv (the alphabet, apostrophe class, and homoglyph map — shared
      # primitives every implementation's tokenizer/sanitizer needs) is normative;
      # tokenize.py/normalize.py keep hand-written literals for zero-I/O startup, and
      # this is what stops the two from silently drifting apart.
      - run: uv run python scripts/check_charclass_sync.py
      # Request text must never reach a log line, in src/pravapis/api/ or anywhere a
      # future endpoint lands. See docs/API.md, "Privacy".
      - run: uv run python scripts/check_no_request_text_logging.py
      # The committed openapi.json is the FastAPI service's contract in machine-
      # readable form. Any drift is either a documented /v2 decision or a bug.
      - run: uv run python scripts/export_openapi.py --check
      # The data is a specification, so check it against that specification before
      # anything else runs: a schema nobody enforces is a comment.
      - run: uv run pravapis validate-data
      # The TypeScript port's data build: reads data/MANIFEST (same file and hash
      # function as pravapis.dataversion, never a glob), validates every file that has
      # a JSON Schema, translates the regex dialect, and emits js/src/generated/*.json.
      - run: npm ci
        working-directory: js
      # src/ imports the generated JSON (gitignored), so it must exist before tsc runs.
      - run: npm run build-data
        working-directory: js
      - run: npm run typecheck
        working-directory: js
      # It computed its own data hash the same way compute_data_hash() does; if the two
      # disagree, the two builds are reading two different ideas of "the data" and every
      # other check above is validating one of them while the other ships unverified.
      - name: Cross-check the JS data hash against the Python one
        shell: bash
        run: |
          py_hash=$(uv run python -c "from pravapis.dataversion import compute_data_hash; print(compute_data_hash())")
          js_hash=$(node -p "require('./js/src/generated/core.json').dataHash")
          echo "python: $py_hash"
          echo "js:     $js_hash"
          if [ "$py_hash" != "$js_hash" ]; then
            echo "::error::data hash mismatch: Python computed $py_hash, the JS data build computed $js_hash"
            exit 1
          fi
      # Replays conformance/cases.jsonl against the JS port itself (not just its data
      # build) — js/scripts/test-conformance.ts. Failures outside
      # js/scripts/known-gaps.json (documented: no stress table) fail the build, and so
      # does a listed gap that starts passing without the file being updated.
      - run: npm test
        working-directory: js
      # Bundles the package (tsup: ESM + CJS + .d.ts) and checks its published file
      # list stays limited to dist/ + package.json — no src/, scripts/, or generated/
      # leaking into what `npm publish` would ship.
      - run: npm run build
        working-directory: js
      - name: Check the published npm file list is clean
        shell: bash
        working-directory: js
        run: |
          files=$(npm pack --dry-run --json --ignore-scripts 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].files.map(f=>f.path).join('\n')))")
          echo "$files"
          if echo "$files" | grep -vE '^dist/|^package\.json$'; then
            echo "::error::unexpected file(s) in the npm package — see above"
            exit 1
          fi
      # The conformance corpus is the cross-language contract. It is generated from the
      # data, so a data change that did not regenerate it leaves the contract describing
      # the old behaviour — which is worse than having no contract. This fails on that.
      - run: uv run pravapis export-conformance --check
      - run: uv run pytest --cov=pravapis --cov-report=term-missing
      - run: uv run pravapis build-lexicon data/lexicon --out data/lexicon.marisa
      - run: uv run pravapis eval data/eval/gold.tsv --json eval.json
      # Independent T → N on genuine Taraškievica. No --out: CI reports, never rewrites
      # the reviewed verdicts in data/eval/tarask/audit.tsv.
      - run: uv run pravapis audit data/eval/tarask/corpus.tsv --to narkamauka --top 15
      # Recall and precision against the aligned be ↔ be-tarask corpus, so both numbers
      # are in the log of every run rather than only in whatever was last pasted into the
      # README. Reporting only: the gates that can fail the build are in pytest
      # (tests/test_negative_set.py). The dev split — test is frozen and read at
      # milestones, not on every push.
      - run: uv run pravapis eval --recall --split dev
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: eval-report
          path: eval.json
      # The artifact a port is measured against, published per run alongside the data
      # version that produced it.
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: conformance-corpus
          path: |
            conformance/cases.jsonl
            conformance/known_failures.jsonl
            conformance/manifest.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pravapis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
