<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pravapis — Наркамаўка ↔ Тарашкевіца</title>
<meta name="description" content="Bidirectional Belarusian orthography converter: Narkamaŭka ↔ Taraškievica.">
<style>
  :root {
    --bg: #f7f6f3;
    --panel: #ffffff;
    --ink: #1d1d1b;
    --muted: #6b6a64;
    --line: #dedbd3;
    --accent: #a1271f;
    --accent-ink: #ffffff;
    --focus: #2f5fa7;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --panel: #1f1f1d;
      --ink: #eceae4;
      --muted: #a3a19a;
      --line: #3a3935;
      --accent: #e0655a;
      --accent-ink: #151514;
      --focus: #7fa6e0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
  h1 { margin: 0 0 24px; font-size: 1.5rem; letter-spacing: -0.01em; font-weight: 600; }

  .seg {
    display: inline-flex; flex-wrap: wrap; gap: 3px; max-width: 100%;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel);
  }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted);
    font-size: 0.93rem; user-select: none; white-space: nowrap;
  }
  .seg input:checked + label { background: var(--ink); color: var(--bg); }
  .seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0; }
  .note { min-height: 1.2em; margin: 10px 0 0; font-size: 0.9em; opacity: 0.75; }
  @media (max-width: 720px) {
    .panes { grid-template-columns: 1fr; }
    /* The two direction labels do not fit side by side on a phone; give each its own row. */
    .seg { display: flex; border-radius: 14px; }
    .seg label { flex: 1 1 100%; text-align: center; }
  }
  textarea {
    width: 100%; min-height: 300px; resize: vertical;
    padding: 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--ink);
    font: 1rem/1.6 var(--sans);
  }
  textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: -1px; }
  textarea[readonly] { color: var(--muted); }

  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
    padding: 10px 26px; font: 600 1rem var(--sans); cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .error { margin-left: 14px; color: var(--accent); font-size: 0.93rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>pravapis</h1>

  <div class="seg" role="radiogroup" aria-label="Кірунак">
    <input type="radio" name="dir" id="dir-t" value="taraskievica" checked>
    <label for="dir-t">Наркамаўка → Тарашкевіца</label>
    <input type="radio" name="dir" id="dir-n" value="narkamauka">
    <label for="dir-n">Тарашкевіца → Наркамаўка</label>
    <input type="radio" name="dir" id="dir-l" value="lacinka">
    <label for="dir-l">Лацінка</label>
    <input type="radio" name="dir" id="dir-o" value="official">
    <label for="dir-o">Афіцыйная лацінка</label>
  </div>

  <p class="note" id="note"></p>

  <div class="panes">
    <textarea id="input" spellcheck="false" aria-label="Тэкст" placeholder="Увядзіце тэкст…"></textarea>
    <textarea id="output" readonly aria-label="Вынік" aria-live="polite"></textarea>
  </div>

  <div>
    <button id="go" type="button">Перакласці</button>
    <span class="error" id="error" role="alert"></span>
  </div>
</div>

<script>
(() => {
  "use strict";

  const MAX_CHARS = 50000;  // same limit as pravapis.webapi.MAX_CHARS

  const $ = (id) => document.getElementById(id);
  const input = $("input"), output = $("output"), go = $("go"), error = $("error");
  const note = $("note");

  // Łacinka is paired with Taraškievica and the official romanisation with Narkamaŭka:
  // each shares that orthography's treatment of softness, so the API converts first.
  // See data/TRANSLIT.md.
  const SCRIPTS = {
    lacinka: "Лацінка Тарашкевіча: спачатку тэкст пераводзіцца ў тарашкевіцу (сьнег → śnieh).",
    official: "Афіцыйная трансьлітарацыя 2007: мяккасьць не пазначаецца (снег → snieh).",
  };

  const choice = () => document.querySelector('input[name="dir"]:checked').value;

  function requestBody(text) {
    const value = choice();
    return SCRIPTS[value]
      ? { text, script: value }
      : { text, direction: value };
  }

  document.querySelectorAll('input[name="dir"]').forEach((r) =>
    r.addEventListener("change", () => {
      note.textContent = SCRIPTS[choice()] || "";
      // Continuing from a Latin output would feed Latin back in, which this page does
      // not read; only chain when staying in Cyrillic.
      if (output.value && !SCRIPTS[choice()]) input.value = output.value;
      if (input.value.trim()) convert(); else clear();
    })
  );
  go.addEventListener("click", convert);
  input.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); convert(); }
  });

  function clear() { output.value = ""; error.textContent = ""; }

  function fail(message) { output.value = ""; error.textContent = message; }

  async function convert() {
    const text = input.value;
    if (!text.trim()) { clear(); return; }
    if (text.length > MAX_CHARS) {
      fail(`Тэкст мае ${text.length} знакаў; максімум ${MAX_CHARS}.`);
      return;
    }
    go.disabled = true;
    error.textContent = "";
    try {
      const res = await fetch("/api/convert", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestBody(text)),
      });
      const body = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      // The frozen contract (docs/API.md): the converted text is `text`, and
      // `changes` carry start/end offsets into it. Those offsets are Unicode CODE
      // POINTS, and JS strings are indexed in UTF-16 code units — identical for
      // Cyrillic, one apart the moment the input holds an emoji. Nothing here slices
      // by offset yet; anything that starts to must convert first. See codePointSlice
      // in docs/API.md.
      output.value = body.text;
    } catch (err) {
      fail(err.message);
    } finally {
      go.disabled = false;
    }
  }
})();
</script>
</body>
</html>
