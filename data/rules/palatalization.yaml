version: "1.0"
group: assimilative_softness
# Reference implementation: src/pravapis/rules/palatalization.py — the tests
# assert the two agree on every generated word. Rules apply to lowercase words,
# highest priority first; `repeat` re-applies a rule until it stops changing
# the word (softness propagates leftward: свіння → свіньня → сьвіньня).
rules:
  # ---------------------------------------------------------------- N → T
  - id: palat.apostrophe
    description: "Dental + apostrophe + iotated vowel is written with ь: з’ява → зьява"
    citation: "Збор 2005, §29, §43"
    direction: narkamauka_to_taraskievica
    pattern: '([зс])’(?=[еёіюя])'
    replacement: '\1ь'
    priority: 120
    tests:
      positive:
        - { input: "з’ява", expected: "зьява" }
        - { input: "з’езд", expected: "зьезд" }
      negative:
        - { input: "аб’ява", expected: "аб’ява" }
        - { input: "б’ю", expected: "б’ю" }

  - id: palat.geminate.dz
    description: "Soft geminate дз: суддзя → судзьдзя; not at a prefix boundary (аддзел)"
    citation: "Збор 2005, §40, §32, §41 Заўвага А"
    direction: narkamauka_to_taraskievica
    # Збор 2005 §40 (судзьдзя, стагодзьдзе); §32 and §41 Заўвага А: prefixes
    # ад-/пад-/над-/перад- before дз are written unchanged (аддзел, аддзячыць, паддзець).
    # Written as one (?<!^prefix) per length rather than a single variable-width
    # lookbehind over the prefix alternation: stdlib re (and JS RegExp) require each
    # lookbehind to be fixed-width, only `regex` accepts variable width, and scripts/
    # lint_patterns.py compiles every pattern both ways so a JS port can rely on it.
    # Each group here is exactly the original alternation's members of that length —
    # `(?<!^A)(?<!^B)` excludes the same set as `(?<!^(?:A|B))` when A and B are the only
    # two candidates, by De Morgan; verified against every (prefix, trigger) combination
    # the original alternation could produce, plus every corpus word containing "ддз".
    pattern: '(?<!^а)(?<!^(?:за|на|па|уа))(?<!^(?:выа|заа|зна|зпа|наа|паа|уна|упа|уса))(?<!^(?:вына|выпа|зана|запа|нана|напа|пана|папа|пера|раза|усна|успа))(?<!^(?:зпера|пераа|разна|разпа|упера))(?<!^(?:выпера|запера|напера|папера|перана|перапа|успера))(?<!^разпера)(?<!^перапера)д(?=дз[еёіюяь])'
    replacement: 'дзь'
    priority: 115
    tests:
      positive:
        - { input: "суддзя", expected: "судзьдзя" }
        - { input: "стагоддзе", expected: "стагодзьдзе" }
      negative:
        - { input: "падзея", expected: "падзея" }
        - { input: "аддзел", expected: "аддзел" }
        - { input: "аддзячыць", expected: "аддзячыць" }
        - { input: "паддзець", expected: "паддзець" }

  - id: palat.geminate
    description: "Soft geminates take ь: насенне → насеньне, жыццё → жыцьцё, вяселле → вясельле"
    citation: "Збор 2005, §40"
    direction: narkamauka_to_taraskievica
    pattern: '(дз|[нлзсц])(?=\1[еёіюяь])'
    replacement: '\1ь'
    priority: 110
    repeat: true
    tests:
      positive:
        - { input: "насенне", expected: "насеньне" }
        - { input: "жыццё", expected: "жыцьцё" }
        - { input: "вяселле", expected: "вясельле" }
        - { input: "пытанне", expected: "пытаньне" }
        - { input: "калоссе", expected: "калосьсе" }
      negative:
        - { input: "ванна", expected: "ванна" }
        - { input: "рассада", expected: "рассада" }

  - id: palat.assim
    description: "з, с soften before a soft consonant (not г, к, х): снег → сьнег, свет → сьвет"
    citation: "Збор 2005, §29"
    direction: narkamauka_to_taraskievica
    # Збор 2005 §29. (?<!д) keeps the з of the digraph дз out; дз and ц are §30.
    pattern: '((?<!д)з|с)(?=(?:дз|[вмпблнсзц])[еёіюяь])'
    replacement: '\1ь'
    priority: 100
    repeat: true
    exceptions:
      - супермен
    tests:
      positive:
        - { input: "снег", expected: "сьнег" }
        - { input: "свет", expected: "сьвет" }
        - { input: "песня", expected: "песьня" }
        - { input: "свіння", expected: "сьвіння" }
        - { input: "косць", expected: "косьць" }
        - { input: "здзейсніць", expected: "зьдзейсьніць" }
        - { input: "рассцілаць", expected: "расьсьцілаць" }
      negative:
        - { input: "дзверы", expected: "дзверы" }
        - { input: "падсекчы", expected: "падсекчы" }
        - { input: "адзначыць", expected: "адзначыць" }
        - { input: "скептык", expected: "скептык" }
        - { input: "склеп", expected: "склеп" }
        - { input: "пісьмо", expected: "пісьмо" }
        - { input: "касьба", expected: "касьба" }

  - id: palat.assim.ts_dz
    description: "ц, дз soften only before a soft в within a root: дзверы → дзьверы, цвік → цьвік"
    citation: "Збор 2005, §30, §30 Заўвага А"
    direction: narkamauka_to_taraskievica
    # Збор 2005 §30; Заўвага А: before other consonants they stay hard (мацнець, пэндзлік, Цнянка).
    pattern: '(дз|ц)(?=в[еёіюяь])'
    replacement: '\1ь'
    priority: 100
    repeat: true
    tests:
      positive:
        - { input: "дзверы", expected: "дзьверы" }
        - { input: "цвік", expected: "цьвік" }
        - { input: "дзве", expected: "дзьве" }
        - { input: "сцвярджаць", expected: "сцьвярджаць" }
      negative:
        - { input: "мацнець", expected: "мацнець" }
        - { input: "пэндзлік", expected: "пэндзлік" }
        - { input: "цнянка", expected: "цнянка" }
        - { input: "цвыркун", expected: "цвыркун" }

  # ---------------------------------------------------------------- T → N
  - id: palat.ungeminate.dz
    description: "судзьдзя → суддзя"
    citation: "derived:palat.geminate.dz (Збор 2005, §40)"
    direction: taraskievica_to_narkamauka
    pattern: 'дзь(?=дз[еёіюяь])'
    replacement: 'д'
    priority: 120
    tests:
      positive:
        - { input: "судзьдзя", expected: "суддзя" }

  - id: palat.ungeminate
    description: "Drop ь inside soft geminates: насеньне → насенне, жыцьцё → жыццё"
    citation: "derived:palat.geminate (Збор 2005, §40)"
    direction: taraskievica_to_narkamauka
    pattern: '(дз|[нлзсц])ь(?=\1[еёіюяь])'
    replacement: '\1'
    # Below palat.unassim: dropping a geminate's ь first would hide the soft
    # trigger licensing the ь to its left (зьльлю → зьллю instead of зллю).
    priority: 100
    repeat: true
    tests:
      positive:
        - { input: "насеньне", expected: "насенне" }
        - { input: "жыцьцё", expected: "жыццё" }
        - { input: "вясельле", expected: "вяселле" }
      negative:
        - { input: "гусь", expected: "гусь" }

  - id: palat.unassim
    description: "Drop assimilative ь of з, с before a soft consonant: сьнег → снег; keep genuine ь: пісьмо"
    citation: "derived:palat.assim (Збор 2005, §29, §29 Заўвага Б)"
    direction: taraskievica_to_narkamauka
    pattern: '((?<!д)з|с)ь(?=(?:дз|[вмпблнсзц])[еёіюяь])'
    replacement: '\1'
    priority: 110
    repeat: true
    exceptions:
      - пісьме
      - пісьменнік
      - пісьменьнік
    tests:
      positive:
        - { input: "сьнег", expected: "снег" }
        - { input: "сьвет", expected: "свет" }
        - { input: "сьвіньня", expected: "свіньня" }
        - { input: "косьць", expected: "косць" }
        - { input: "расьсьцілаць", expected: "рассцілаць" }
      negative:
        - { input: "пісьмо", expected: "пісьмо" }
        - { input: "касьба", expected: "касьба" }
        - { input: "восьмы", expected: "восьмы" }
        - { input: "дзень", expected: "дзень" }
        - { input: "дзьме", expected: "дзьме" }

  - id: palat.unassim.ts_dz
    description: "Drop the ь of ц, дз before a soft в: дзьверы → дзверы, цьвік → цвік"
    citation: "derived:palat.assim.ts_dz (Збор 2005, §30)"
    direction: taraskievica_to_narkamauka
    pattern: '(дз|ц)ь(?=в[еёіюяь])'
    replacement: '\1'
    priority: 110
    repeat: true
    tests:
      positive:
        - { input: "дзьверы", expected: "дзверы" }
        - { input: "цьвік", expected: "цвік" }
      negative:
        - { input: "дзьме", expected: "дзьме" }
        - { input: "бацькі", expected: "бацькі" }

  - id: palat.unapostrophe
    description: "зь/сь before an iotated vowel is the apostrophe in Narkamaŭka: зьява → з’ява"
    citation: "derived:palat.apostrophe (Збор 2005, §29, §43)"
    direction: taraskievica_to_narkamauka
    pattern: '([зс])ь(?=[еёіюя])'
    replacement: '\1’'
    priority: 90
    tests:
      positive:
        - { input: "зьява", expected: "з’ява" }
        - { input: "зьезд", expected: "з’езд" }
      negative:
        - { input: "гразь", expected: "гразь" }
