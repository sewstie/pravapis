version: "1.0"
group: loanwords
# Loanword adaptation. Most of these alternations are lexically conditioned
# (план → плян but лапа → лапа), so the function-backed rules only fire on
# curated stem lists (src/pravapis/rules/loanwords.py); everything else is the
# lexicon's job. Only ґ → г and Еў ↔ Эў are genuinely regular.
rules:
  # ---------------------------------------------------------------- N → T
  - id: loan.eu
    description: "Word-initial еў → эў in loanwords and classical names: Еўропа → Эўропа, Еўклід → Эўклід"
    direction: narkamauka_to_taraskievica
    # Збор 2005 §52: Greek ευ / Latin eu → эў (эўфарыя, Эўклід, Эўропа, Эўфрат). Out of scope
    # (§52 "але даўно асвоеныя імёны …"; §72 Заўвага А, footnote 68): traditional Christian
    # given names, borrowed through Church Slavonic, which keep Е- (Еўдакія – Аўдоцьця,
    # Е(ў)фрасіньня – Эўфрасіньня). That class is not visible in the spelling, so it is
    # excluded by the stems of the names the book gives. WORKAROUND: extend the list only
    # with names the book (or another cited source) puts in that class.
    pattern: '^еў(?!дакі|фрасін)'
    replacement: 'эў'
    priority: 50
    tests:
      positive:
        - { input: "еўропа", expected: "эўропа" }
        - { input: "еўрапейскі", expected: "эўрапейскі" }
        - { input: "еўклід", expected: "эўклід" }
        - { input: "еўфрат", expected: "эўфрат" }
      negative:
        - { input: "леў", expected: "леў" }
        - { input: "еўдакія", expected: "еўдакія" }
        - { input: "еўдакіі", expected: "еўдакіі" }
        - { input: "еўфрасіння", expected: "еўфрасіння" }

  - id: loan.l_palatalization
    description: "Soft l in curated Western stems: план → плян, біялогія → біялёгія"
    direction: narkamauka_to_taraskievica
    function: "pravapis.rules.loanwords:apply_l_palatalization"
    priority: 40
    tests:
      positive:
        - { input: "план", expected: "плян" }
        - { input: "лампа", expected: "лямпа" }
        - { input: "біялогія", expected: "біялёгія" }
        - { input: "балкон", expected: "балькон" }
      negative:
        - { input: "лапа", expected: "лапа" }
        - { input: "падлогі", expected: "падлогі" }

  - id: loan.i_to_y
    description: "ы after dentals in Greco-Latin stems: сістэма → сыстэма"
    direction: narkamauka_to_taraskievica
    function: "pravapis.rules.loanwords:apply_i_to_y"
    priority: 40
    tests:
      positive:
        - { input: "сістэма", expected: "сыстэма" }
        - { input: "прэзідэнт", expected: "прэзыдэнт" }
        - { input: "фізіка", expected: "фізыка" }
        - { input: "класічны", expected: "класычны" }
      negative:
        - { input: "сіла", expected: "сіла" }
        - { input: "сіні", expected: "сіні" }

  - id: loan.f_substitution
    description: "Traditional names: Фёдар → Хведар, Фядос → Хвядос (optional form)"
    direction: narkamauka_to_taraskievica
    function: "pravapis.rules.loanwords:apply_f_substitution"
    # Збор 2005 §81 Заўвага Б: Тодар, Фёдар, Хведар, Ходар are all valid; Фёдар needs
    # no change. Applied only in aggressive mode.
    optional: true
    priority: 40
    tests:
      positive:
        - { input: "фёдар", expected: "хведар" }
        - { input: "фёдара", expected: "хведара" }
        - { input: "фядос", expected: "хвядос" }
      negative:
        - { input: "фабрыка", expected: "фабрыка" }
        - { input: "філіп", expected: "філіп" }

  - id: loan.g_distinction
    description: "Plosive ґ in old borrowings: ганак → ґанак, гузік → ґузік"
    direction: narkamauka_to_taraskievica
    function: "pravapis.rules.loanwords:apply_g_distinction"
    priority: 40
    tests:
      positive:
        - { input: "ганак", expected: "ґанак" }
        - { input: "гузік", expected: "ґузік" }
        - { input: "грунт", expected: "ґрунт" }
      negative:
        - { input: "гара", expected: "гара" }
        - { input: "гуска", expected: "гуска" }

  # ---------------------------------------------------------------- T → N
  - id: loan.g_remove
    description: "Narkamaŭka has no ґ"
    direction: taraskievica_to_narkamauka
    pattern: 'ґ'
    replacement: 'г'
    priority: 50
    tests:
      positive:
        - { input: "ґанак", expected: "ганак" }

  - id: loan.l_unpalatalization
    description: "Reverse of loan.l_palatalization on the same stems: плян → план"
    direction: taraskievica_to_narkamauka
    function: "pravapis.rules.loanwords:remove_l_palatalization"
    # Above loan.y_to_i so клясычны → класычны → класічны.
    priority: 45
    tests:
      positive:
        - { input: "плян", expected: "план" }
        - { input: "лябараторыі", expected: "лабараторыі" }
        - { input: "тэхналёгій", expected: "тэхналогій" }
        - { input: "кілямэтраў", expected: "кіламетраў" }
      negative:
        - { input: "салёны", expected: "салёны" }
        - { input: "лёгкі", expected: "лёгкі" }

  - id: loan.y_to_i
    description: "Reverse of loan.i_to_y on the same stems: сыстэма → сістэма"
    direction: taraskievica_to_narkamauka
    function: "pravapis.rules.loanwords:remove_i_to_y"
    priority: 40
    tests:
      positive:
        - { input: "сыстэму", expected: "сістэму" }
        - { input: "сынонімы", expected: "сінонімы" }
        - { input: "апазыцыя", expected: "апазіцыя" }
        - { input: "класычнага", expected: "класічнага" }
      negative:
        - { input: "сыры", expected: "сыры" }
        - { input: "сын", expected: "сын" }

  - id: loan.eu_reverse
    description: "Word-initial эўр → еўр: Эўропа → Еўропа"
    direction: taraskievica_to_narkamauka
    pattern: '^эў(?=р)'
    replacement: 'еў'
    priority: 50
    exceptions:
      - эўрыстыка
      - эўрыстычны
    tests:
      positive:
        - { input: "эўропа", expected: "еўропа" }
      negative:
        - { input: "эўрыстыка", expected: "эўрыстыка" }
