version: "2.0"
group: loanwords
# Loanword adaptation. Every alternation here is regular *given* that the word is a
# Western borrowing — Збор 2005 §11б states the э rule as a plain phonological
# condition, and §55.1/§56.2 do the same for soft л. What is not recoverable from
# the spelling is the etymology itself, so these rules are gated on the stem
# inventory in data/lexicon/stems/stems.tsv via `requires_class` + `alternation`,
# and each transducer rewrites only inside the matched stem.
#
# Only ґ → г and Еў ↔ Эў need no etymology: ґ occurs solely in loans, and еў- is
# regular by position.
#
# PRIORITY: every rule here sits ABOVE palatalization (which tops out at 120). Softness
# is a *consequence* of the vowel, so the vowel has to be settled first: palat.assim
# reading с·п·е in спектаклі writes сь, and loan.e_to_eh then turns that е into э — a
# ь that was never warranted (сьпэктаклі for спэктаклі). Running the etymology rules
# first also keeps their stem spans valid, since nothing has changed the word's length
# before they fire. See data/NORMS.md, "Palatalization audit".
rules:
  # ---------------------------------------------------------------- N → T
  - id: loan.eu
    description: "Word-initial еў/еу → эў/эу: Еўропа → Эўропа, Еурапейская → Эурапейская"
    citation: "Збор 2005, §52, §72 Заўвага А"
    direction: narkamauka_to_taraskievica
    # Збор 2005 §52: Greek ευ / Latin eu → эў (эўфарыя, Эўклід, Эўропа, Эўфрат). Out of scope
    # (§52 "але даўно асвоеныя імёны …"; §72 Заўвага А, footnote 68): traditional Christian
    # given names, borrowed through Church Slavonic, which keep Е- (Еўдакія – Аўдоцьця,
    # Е(ў)фрасіньня – Эўфрасіньня). That class is not visible in the spelling, so it is
    # excluded by the stems of the names the book gives.
    #
    # Both ў and plain у are matched. Belarusian writes ў after a vowel, so Еуропа is a
    # misspelling of Еўропа — but it is one people type, and the е is wrong either way.
    # Only the е is rewritten, so whichever u the input used survives.
    pattern: '^е(?=[ўу])(?![ўу](?:дакі|фрасін))'
    replacement: 'э'
    priority: 185
    tests:
      positive:
        - { input: "еўропа", expected: "эўропа" }
        - { input: "еурапейская", expected: "эурапейская" }
        - { input: "еуропа", expected: "эуропа" }
        - { input: "еўрапейскі", expected: "эўрапейскі" }
        - { input: "еўклід", expected: "эўклід" }
        - { input: "еўфрат", expected: "эўфрат" }
      negative:
        - { input: "леў", expected: "леў" }
        - { input: "еўдакія", expected: "еўдакія" }
        - { input: "еўдакіі", expected: "еўдакіі" }
        - { input: "еўфрасіння", expected: "еўфрасіння" }

  - id: loan.stem_target
    description: "Stems the regular alternations cannot derive: каланіял → калёніял"
    citation: "Збор 2005, §55.1"
    direction: narkamauka_to_taraskievica
    # Narkamaŭka akanne wrote the etymological о of колон- as а, so no rule conditioned
    # on the Narkamaŭka spelling can recover калёніял. The 6th column of stems.tsv
    # carries the target directly.
    function: "pravapis.rules.loanwords:apply_stem_target"
    requires_class: loan
    priority: 200
    tests:
      positive:
        - { input: "каланіяльны", expected: "калёніяльны" }
      negative:
        - { input: "план", expected: "план" }

  - id: loan.l_palatalization
    description: "Soft l in Western stems: план → плян, біялогія → біялёгія"
    citation: "Збор 2005, §55.1, §55.2, §56.2"
    direction: narkamauka_to_taraskievica
    function: "pravapis.rules.loanwords:apply_l_palatalization"
    requires_class: loan
    alternation: l
    priority: 195
    tests:
      positive:
        - { input: "план", expected: "плян" }
        - { input: "лампа", expected: "лямпа" }
        - { input: "біялогія", expected: "біялёгія" }
        - { input: "балкон", expected: "балькон" }
      negative:
        - { input: "лапа", expected: "лапа" }
        - { input: "падлогі", expected: "падлогі" }
        - { input: "класці", expected: "класці" }

  - id: loan.i_to_y
    description: "ы after hard dentals in Greco-Latin stems: сістэма → сыстэма"
    citation: "Збор 2005, §67, §66"
    direction: narkamauka_to_taraskievica
    function: "pravapis.rules.loanwords:apply_i_to_y"
    requires_class: loan
    alternation: i
    priority: 192
    tests:
      positive:
        - { input: "сістэма", expected: "сыстэма" }
        - { input: "прэзідэнт", expected: "прэзыдэнт" }
        - { input: "фізіка", expected: "фізыка" }
      negative:
        - { input: "сіла", expected: "сіла" }
        - { input: "сіні", expected: "сіні" }
        - { input: "марксізм", expected: "марксізм" }

  - id: loan.e_to_eh
    description: "э after consonants in borrowings: сезон → сэзон, версія → вэрсія"
    citation: "Збор 2005, §11б, §12 Заўвага Б"
    direction: narkamauka_to_taraskievica
    # Збор 2005 §11б: "У пазычаньнях і вытворных ад іх словах … Літара э пішацца …
    # б) пасьля зычных, акрамя л і заднеязычных (г (ґ), к, х)".
    # §12 Заўвага Б lists the assimilated borrowings that keep е; they are the
    # exceptions below.
    function: "pravapis.rules.loanwords:apply_e_to_eh"
    requires_class: loan
    alternation: e
    priority: 190
    exceptions:
      - блюзьнер
      - жаўнер
      - касінер
      - каўнер
      - кушнер
      - манер
      - манера
      - шынель
    tests:
      positive:
        - { input: "сезон", expected: "сэзон" }
        - { input: "версія", expected: "вэрсія" }
        - { input: "аперацыя", expected: "апэрацыя" }
        - { input: "метро", expected: "мэтро" }
        - { input: "бізнес", expected: "бізнэс" }
      negative:
        - { input: "мера", expected: "мера" }
        - { input: "серада", expected: "серада" }
        - { input: "неба", expected: "неба" }
        - { input: "месяц", expected: "месяц" }

  - id: loan.f_substitution
    description: "Traditional names: Фёдар → Хведар, Фядос → Хвядос (optional form)"
    citation: "Збор 2005, §81 Заўвага Б"
    direction: narkamauka_to_taraskievica
    function: "pravapis.rules.loanwords:apply_f_substitution"
    # Збор 2005 §81 Заўвага Б: Тодар, Фёдар, Хведар, Ходар are all valid; Фёдар needs
    # no change. Applied only in aggressive mode.
    optional: true
    priority: 186
    tests:
      positive:
        - { input: "фёдар", expected: "хведар" }
        - { input: "фёдара", expected: "хведара" }
        - { input: "фядос", expected: "хвядос" }
      negative:
        - { input: "фабрыка", expected: "фабрыка" }
        - { input: "філіп", expected: "філіп" }

  # ---------------------------------------------------------------- T → N
  - id: loan.g_remove
    description: "ґ → г: Narkamaŭka has no ґ, and this project does not write it either"
    citation: "Збор 2005, альфабэт, зноска *"
    direction: taraskievica_to_narkamauka
    pattern: 'ґ'
    replacement: 'г'
    priority: 185
    tests:
      positive:
        - { input: "ґанак", expected: "ганак" }

  - id: loan.stem_reverse
    description: "Taraškievica loan stem back to its Narkamaŭka form: плян → план, сыстэма → сістэма, сэзон → сезон"
    citation: "derived:loan.l_palatalization (Збор 2005, §55.1, §56.2, §67, §11б)"
    direction: taraskievica_to_narkamauka
    # The reverse index is derived from the forward one and every entry carries its
    # Narkamaŭka stem, so this is a substitution rather than an inverse transducer —
    # see data/NORMS.md, "Etymology is data". An inverse transducer cannot work here:
    # балькон → балкон must drop a ь and лякальн → лакальн must keep one, and the
    # string does not say which.
    function: "pravapis.rules.loanwords:apply_stem_target"
    requires_class: loan
    priority: 200
    tests:
      positive:
        - { input: "плян", expected: "план" }
        - { input: "лябараторыя", expected: "лабараторыя" }
        - { input: "лякальна", expected: "лакальна" }
        - { input: "балькон", expected: "балкон" }
        - { input: "сыстэму", expected: "сістэму" }
        - { input: "сынонімы", expected: "сінонімы" }
        - { input: "сэзон", expected: "сезон" }
        - { input: "вэрсія", expected: "версія" }
        - { input: "калёніяльны", expected: "каланіяльны" }
      negative:
        - { input: "салёны", expected: "салёны" }
        - { input: "лёгкі", expected: "лёгкі" }
        - { input: "сыры", expected: "сыры" }
        - { input: "сын", expected: "сын" }
        - { input: "лес", expected: "лес" }
        - { input: "мера", expected: "мера" }

  - id: loan.eu_reverse
    description: "Word-initial эўр → еўр: Эўропа → Еўропа"
    citation: "derived:loan.eu (Збор 2005, §52)"
    direction: taraskievica_to_narkamauka
    pattern: '^э(?=[ўу]р)'
    replacement: 'е'
    priority: 185
    exceptions:
      - эўрыстыка
      - эўрыстычны
    tests:
      positive:
        - { input: "эўропа", expected: "еўропа" }
        - { input: "эурапейская", expected: "еурапейская" }
      negative:
        - { input: "эўрыстыка", expected: "эўрыстыка" }
