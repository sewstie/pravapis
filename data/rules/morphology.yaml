version: "1.0"
group: morphology
# Small deterministic morphological differences. The contextual clitic rules
# (не → ня, без → бяз/бязь, з → зь before a soft onset) need the *next* word
# and live in src/pravapis/rules/morphology.py; only their reverse forms are
# context-free and appear here.
rules:
  # ---------------------------------------------------------------- N → T
  - id: morph.final_tr
    description: "Epenthetic а in word-final -тр/-др: тэатр → тэатар, цэнтр → цэнтар, кадр → кадар"
    citation: "Збор 2005, §26, §26 Заўвага А"
    direction: narkamauka_to_taraskievica
    pattern: '([тд])р$'
    replacement: '\1ар'
    priority: 30
    # Збор 2005 §26 Заўвага А: non-traditional proper names keep tr, dr without the
    # inserted vowel (Нотр-Дам, Сартр). Not decidable from spelling: listed by hand.
    # Hyphenated words are converted part by part, so Нотр-Дам is listed as нотр.
    exceptions:
      - сартр
      - нотр
    tests:
      positive:
        - { input: "тэатр", expected: "тэатар" }
        - { input: "цэнтр", expected: "цэнтар" }
        - { input: "літр", expected: "літар" }
        - { input: "кадр", expected: "кадар" }
      negative:
        - { input: "тэатры", expected: "тэатры" }
        - { input: "сартр", expected: "сартр" }
        - { input: "нотр", expected: "нотр" }
        - { input: "вецер", expected: "вецер" }

  # ---------------------------------------------------------------- T → N
  - id: morph.particle.nya
    description: "Standalone ня → не"
    citation: "derived:morph.particle (Збор 2005, §3)"
    direction: taraskievica_to_narkamauka
    pattern: '^ня$'
    replacement: 'не'
    priority: 30
    tests:
      positive:
        - { input: "ня", expected: "не" }
      negative:
        - { input: "няма", expected: "няма" }

  - id: morph.particle.byaz
    description: "Standalone бяз / бязь → без"
    citation: "derived:morph.particle (Збор 2005, §3, §29)"
    direction: taraskievica_to_narkamauka
    pattern: '^бязь?$'
    replacement: 'без'
    priority: 30
    tests:
      positive:
        - { input: "бяз", expected: "без" }
        - { input: "бязь", expected: "без" }

  - id: morph.preposition.z
    description: "Softened prepositions зь / безь / празь / церазь → з / без / праз / цераз"
    citation: "derived:morph.particle (Збор 2005, §29)"
    direction: taraskievica_to_narkamauka
    pattern: '^(з|без|праз|цераз)ь$'
    replacement: '\1'
    priority: 30
    tests:
      positive:
        - { input: "зь", expected: "з" }
        - { input: "безь", expected: "без" }
        - { input: "празь", expected: "праз" }
      negative:
        - { input: "гразь", expected: "гразь" }

  - id: morph.conj_j_i
    description: "The conjunction й has no Narkamaŭka form: сала й цыбуля → сала і цыбуля"
    citation: "derived:morph.conj_i_j (Збор 2005, §13)"
    direction: taraskievica_to_narkamauka
    # Збор 2005 §13 lets the conjunction і become й after a vowel in Taraškievica; the
    # forward rule is optional (morph.conj_i_j, aggressive mode only) because і stays
    # valid. The reverse is not optional: Narkamaŭka has no syllabic й as a word, so
    # every standalone й must come back. Anchored to the whole word — й inside a word
    # (мой, край) is a different letter doing a different job.
    pattern: '^й$'
    replacement: 'і'
    priority: 30
    tests:
      positive:
        - { input: "й", expected: "і" }
      negative:
        - { input: "мой", expected: "мой" }
        - { input: "край", expected: "край" }
        - { input: "йод", expected: "йод" }

  - id: morph.dsk_to_dzk
    description: "д + ск → дзк before the adjective suffix: мадрыдскі → мадрыдзкі"
    citation: "Збор 2005, §46"
    direction: narkamauka_to_taraskievica
    # Збор 2005 §46. Taraškievica writes the phonetic result of the merger where
    # Narkamaŭka keeps the root consonant intact (the morphological principle):
    # Мадрыд → мадрыдзкі, горад → гарадзкі. It applies by the *stem's final consonant*,
    # not by whether the word is foreign — бэрлінскі, лёнданскі and нью-ёркскі keep their
    # clusters because those stems end in н and к.
    pattern: 'дск'
    replacement: 'дзк'
    priority: 60
    tests:
      positive:
        - { input: "мадрыдскі", expected: "мадрыдзкі" }
        - { input: "гарадскі", expected: "гарадзкі" }
        - { input: "людскі", expected: "людзкі" }
      negative:
        - { input: "берлінскі", expected: "берлінскі" }
        - { input: "лонданскі", expected: "лонданскі" }
        - { input: "нью-ёркскі", expected: "нью-ёркскі" }

  - id: morph.dzk_to_dsk
    description: "Reverse of morph.dsk_to_dzk: мадрыдзкі → мадрыдскі"
    citation: "derived:morph.dsk_to_dzk (Збор 2005, §46)"
    direction: taraskievica_to_narkamauka
    pattern: 'дзк'
    replacement: 'дск'
    priority: 60
    tests:
      positive:
        - { input: "мадрыдзкі", expected: "мадрыдскі" }
        - { input: "гарадзкі", expected: "гарадскі" }
      negative:
        - { input: "бэрлінскі", expected: "бэрлінскі" }

  - id: morph.ejsk_normalise
    description: "The adjective suffix is -ейск-, never -эйск-: эўрапэйскі → еўрапейскі"
    citation: "Збор 2005, §11б заўвага"
    direction: taraskievica_to_narkamauka
    # Збор 2005 §11б, заўвага: the suffix -ейск- keeps its е after a hard consonant,
    # so эўрапэйскі is an error rather than a variant — be-tarask writes it by applying
    # §11б where the заўвага exempts it. The forward direction can never produce it
    # (e_to_eh exempts the suffix), so this only normalises input that arrives wrong.
    # The guard is a list of roots whose эй is part of the STEM, not the suffix, so the
    # э is correct in Narkamaŭka too and rewriting it produces a word that does not
    # exist. Found by the round-trip harness (яўрэйскую → яўрейскую) and confirmed
    # against data/corpora/frequency_be.tsv, which is 44M tokens of Narkamaŭka:
    #   яўрэйск- 5,500+ occurrences, яўрейск- 0
    #   паліцэйск- 1,450+,            паліцейск- 0
    #   карэйск-   390+,              карейск-   0
    # The suffix cases it is meant to catch (эўрапэйскі, армэйскі) have no such root.
    pattern: '(?<!яўр)(?<!паліц)(?<!кар)эйск'
    replacement: 'ейск'
    priority: 60
    tests:
      positive:
        - { input: "эўрапэйскі", expected: "эўрапейскі" }
        - { input: "армэйскі", expected: "армейскі" }
      negative:
        - { input: "эўрапейскі", expected: "эўрапейскі" }
        - { input: "мадрыдзкі", expected: "мадрыдзкі" }
        - { input: "яўрэйскую", expected: "яўрэйскую" }
        - { input: "паліцэйскі", expected: "паліцэйскі" }
        - { input: "карэйскай", expected: "карэйскай" }
